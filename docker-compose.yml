services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tienda-online-api:1.0
    container_name: tienda-api
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    image: tienda-online-frontend:1.0
    container_name: tienda-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
